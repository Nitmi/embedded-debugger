name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test native package tooling
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Check documentation
        run: cargo doc --locked --all-features --no-deps

  package:
    name: Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo package --locked
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build Windows CLI candidate
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $toolDir | Out-Null
          $toolArchive = Join-Path $toolDir 'cargo-about.tar.gz'
          Invoke-WebRequest -Uri 'https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-pc-windows-msvc.tar.gz' -OutFile $toolArchive
          if ((Get-FileHash -LiteralPath $toolArchive -Algorithm SHA256).Hash -ne '1c03e5890238562497c2d89a3b75b02560af349c1fc3e713d3284f532a5cd748') { throw 'cargo-about checksum mismatch' }
          tar -xf $toolArchive -C $toolDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargoAbout = Join-Path $toolDir 'cargo-about-0.9.2-x86_64-pc-windows-msvc/cargo-about.exe'
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_binary.py build --offline --cargo-about $cargoAbout --output-dir target/binary-dist --json
      - name: Verify and smoke test extracted candidate
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath target/binary-dist -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one CLI archive' }
          $archive = $archives[0].FullName
          python scripts/package_binary.py verify $archive --checksum "$archive.sha256" --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $destination = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executables = @(Get-ChildItem -LiteralPath $destination -Filter embedded-debugger.exe -Recurse)
          if ($executables.Count -ne 1) { throw 'Expected one extracted executable' }
          & $executables[0].FullName --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $executables[0].FullName runtime --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidateRoot = $executables[0].DirectoryName
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $candidateRoot 'release-manifest.json') | ConvertFrom-Json
          $binaryHash = ($manifest.files | Where-Object path -eq 'embedded-debugger.exe').sha256
          powershell -NoProfile -File (Join-Path $candidateRoot 'Test-WindowsCandidate.ps1') -Executable $executables[0].FullName -ExpectedSha256 $binaryHash -ReportPath target/binary-dist/windows-host-smoke.json -EnvironmentLabel 'GitHub Windows runner (not a clean machine)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: embedded-debugger-windows-x64-candidate
          path: target/binary-dist/*
