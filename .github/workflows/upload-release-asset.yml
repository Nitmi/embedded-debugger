name: Upload verified release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z)
        required: true
        type: string
      source:
        description: Exact tag source commit (40 lowercase hex digits)
        required: true
        type: string
      run_id:
        description: Successful tag provenance run, attempt 1
        required: true
        type: string
      release_id:
        description: Existing draft release ID
        required: true
        type: string
      sha256:
        description: Exact attested ZIP SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-asset-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify source, attestation and draft before uploading ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          PROVENANCE_RUN: ${{ inputs.run_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          ARCHIVE_SHA256: ${{ inputs.sha256 }}
        run: >-
          python scripts/upload_release_asset.py
          --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE"
          --run-id "$PROVENANCE_RUN" --release-id "$RELEASE_ID"
          --sha256 "$ARCHIVE_SHA256" --output-dir publish-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-asset-evidence
          path: publish-evidence/*.json
          if-no-files-found: warn
