[package]
name = "embedded-debugger"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Nitmi"]
description = "Agent-safe embedded flashing, debugging, evidence capture, and replay"
license = "MIT"
repository = "https://github.com/Nitmi/embedded-debugger"
keywords = ["embedded", "debugging", "probe-rs", "openocd", "agent"]
categories = ["development-tools::debugging", "embedded"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
probe-rs = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
